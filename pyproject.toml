[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-tracker"
version = "0.1.0"
description = "Self-hosted spend tracker with Plaid and Splitwise imports"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["spend_tracker*"]
